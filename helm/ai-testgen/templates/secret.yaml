{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "testgen.fullname" . }}
  labels:
    {{- include "testgen.labels" . | nindent 4 }}
type: Opaque
stringData:
  TESTGEN_DATABASE_URL: {{ required "secrets.databaseUrl (PostgreSQL) is required" .Values.secrets.databaseUrl | quote }}
  TESTGEN_SECRET_KEY: {{ required "secrets.secretKey is required: secrets in the database are encrypted with it" .Values.secrets.secretKey | quote }}
  {{- with .Values.secrets.s3AccessKey }}
  TESTGEN_S3_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.s3SecretKey }}
  TESTGEN_S3_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.oidcClientSecret }}
  TESTGEN_OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.ldapBindPassword }}
  TESTGEN_LDAP_BIND_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.metrics.token }}
  TESTGEN_METRICS_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
