apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "testgen.fullname" . }}-web
  labels:
    {{- include "testgen.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "testgen.selector" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "testgen.selector" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 60
      {{- include "testgen.scheduling" . | nindent 6 }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "server.py"]
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          envFrom:
            {{- include "testgen.envFrom" . | nindent 12 }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Studio sessions live in the instance that started them; the others pass requests there.
            - name: TESTGEN_INSTANCE_URL
              value: "http://$(POD_IP):{{ .Values.web.port }}"
            - name: TESTGEN_EMBEDDED_WORKER
              value: {{ ternary "on" "off" .Values.web.embeddedWorker | quote }}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /api/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            {{- include "testgen.mounts" . | nindent 12 }}
      volumes:
        {{- include "testgen.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "testgen.fullname" . }}
  labels:
    {{- include "testgen.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "testgen.selector" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
