# The studio for a team without Kubernetes: two web instances behind nginx, three workers with
# browsers, PostgreSQL for the data, MinIO for screenshots, traces and baselines (docs/deploy.md).
#
#   1. .env next to this file (keep a copy of TESTGEN_SECRET_KEY: without it secrets cannot be read):
#        TESTGEN_SECRET_KEY=<python -c "import secrets; print(secrets.token_urlsafe(32))">
#        POSTGRES_PASSWORD=...   MINIO_ROOT_PASSWORD=...
#        TESTGEN_ADMINS=admin    # and, for corporate login, TESTGEN_OIDC_* or TESTGEN_LDAP_* (docs/security.md)
#   2. docker compose -f docker-compose.team.yml up -d --build
#   3. The first start prints the password of "admin": docker compose -f docker-compose.team.yml logs studio-1
#   An installation that kept its data in folders moves with
#        docker compose -f docker-compose.team.yml run --rm -v ./data:/old/data -v ./secrets:/old/secrets \
#          studio-1 python -m testgen.db import-files /old/data /old/secrets
#   More workers: docker compose -f docker-compose.team.yml up -d --scale worker=6

x-testgen: &testgen
  image: ai-testgen:latest
  build: .                                  # one image for the web instances and the workers
  environment: &env
    TESTGEN_DATABASE_URL: "postgresql+psycopg://testgen:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/testgen"
    TESTGEN_SECRET_KEY: "${TESTGEN_SECRET_KEY:?set TESTGEN_SECRET_KEY in .env}"
    TESTGEN_S3_ENDPOINT: "http://minio:9000"
    TESTGEN_S3_BUCKET: "ai-testgen"
    TESTGEN_S3_ACCESS_KEY: "testgen"
    TESTGEN_S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}"
    TESTGEN_ADMINS: "${TESTGEN_ADMINS:-admin}"
    TESTGEN_SIGNUP: "${TESTGEN_SIGNUP:-off}"
    ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    TESTGEN_OIDC_ISSUER: "${TESTGEN_OIDC_ISSUER:-}"
    TESTGEN_OIDC_CLIENT_ID: "${TESTGEN_OIDC_CLIENT_ID:-}"
    TESTGEN_OIDC_CLIENT_SECRET: "${TESTGEN_OIDC_CLIENT_SECRET:-}"
    TESTGEN_LDAP_URL: "${TESTGEN_LDAP_URL:-}"
    TESTGEN_LDAP_BASE_DN: "${TESTGEN_LDAP_BASE_DN:-}"
    TESTGEN_LDAP_BIND_DN: "${TESTGEN_LDAP_BIND_DN:-}"
    TESTGEN_LDAP_BIND_PASSWORD: "${TESTGEN_LDAP_BIND_PASSWORD:-}"
    TESTGEN_AUDIT_SYSLOG: "${TESTGEN_AUDIT_SYSLOG:-}"
    TESTGEN_EMBEDDED_WORKER: "off"          # runs go to the workers
    FORWARDED_ALLOW_IPS: "*"                # behind nginx
  shm_size: 1gb                             # Chromium
  depends_on:
    postgres: {condition: service_healthy}
    minio-bucket: {condition: service_completed_successfully}
  restart: unless-stopped

services:
  studio-1:
    <<: *testgen
    environment:
      <<: *env
      TESTGEN_INSTANCE_URL: "http://studio-1:8765"     # where the other instance passes requests about its sessions
  studio-2:
    <<: *testgen
    environment:
      <<: *env
      TESTGEN_INSTANCE_URL: "http://studio-2:8765"
    depends_on:
      studio-1: {condition: service_healthy}           # the first one creates the database schema

  worker:
    <<: *testgen
    command: ["python", "-m", "testgen.worker"]
    environment:
      <<: *env
      TESTGEN_WORKER_CONCURRENCY: "2"
      TESTGEN_METRICS_PORT: "9100"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9100/metrics"]
      interval: 30s
    stop_grace_period: 10m                  # a worker finishes the tests it took
    deploy:
      replicas: 3
    depends_on:
      studio-1: {condition: service_healthy}

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8765:80"
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf
    depends_on: [studio-1, studio-2]
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: testgen
      POSTGRES_USER: testgen
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testgen -d testgen"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: testgen
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  minio-bucket:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c", "mc alias set s3 http://minio:9000 testgen \"$$MINIO_ROOT_PASSWORD\" && mc mb --ignore-existing s3/ai-testgen"]
    environment:
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"

configs:
  nginx:
    content: |
      upstream studio {
        server studio-1:8765;
        server studio-2:8765;
      }
      server {
        listen 80;
        client_max_body_size 30m;
        location / {
          proxy_pass http://studio;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_read_timeout 600s;
          proxy_http_version 1.1;
        }
      }

volumes:
  pgdata:
  s3data:
