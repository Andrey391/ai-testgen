# Regression run of AI Test Generator tests in the CI of the APPLICATION under test.
#
# Put this file into .github/workflows/ of the application's repository. It expects:
#   - the studio code available to the job (here: checked out from its repository);
#   - the tests: the studio's data folder (data/projects/<id>/...) committed next to the
#     application, e.g. under qa/testgen-data, and pointed to by TESTGEN_DATA_DIR;
#   - repository secrets: TESTGEN_USERNAME / TESTGEN_PASSWORD (login of the application under
#     test) and, for self-healing and failure analysis, ANTHROPIC_API_KEY plus the repository
#     variable TESTGEN_MODEL (optional: without them a broken locator just fails the step).
#
# Result: a JUnit report (shown by the "Test report" step and kept as an artifact) and the
# run history / traces in the uploaded data folder. The job fails when a test outside
# quarantine fails; flaky tests (passed on re-run) do not fail it.
name: ui-regression

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"          # nightly full regression

jobs:
  testgen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TESTGEN_DATA_DIR: ${{ github.workspace }}/qa/testgen-data
      TESTGEN_USERNAME: ${{ secrets.TESTGEN_USERNAME }}
      TESTGEN_PASSWORD: ${{ secrets.TESTGEN_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TESTGEN_MODEL: ${{ vars.TESTGEN_MODEL }}
      PROJECT: "My project"       # studio project name or id
      TAG: ${{ github.event_name == 'schedule' && '' || 'smoke' }}   # smoke on pushes, everything nightly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: your-org/ai-testgen      # the studio
          path: .testgen
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the studio
        run: |
          python -m pip install -r .testgen/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run tests
        working-directory: .testgen
        run: |
          python -m testgen.run --project "$PROJECT" ${TAG:+--tag "$TAG"} \
            --junit "$GITHUB_WORKSPACE/reports/junit.xml" --allure "$GITHUB_WORKSPACE/reports/allure"
      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: reports/junit.xml
      - name: Keep reports, run history and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testgen-results
          path: |
            reports/
            qa/testgen-data/projects/*/runs/
