# Regression run of AI Test Generator tests in the CI of the APPLICATION under test.
#
# Put this file into .github/workflows/ of the application's repository. It expects:
#   - the studio code available to the job (here: checked out from its repository);
#   - the studio's database reachable from the runner (a self-hosted runner in the same network,
#     or a tunnel): tests, settings and the model of the project come from there, the runs are
#     recorded there and seen in the studio;
#   - repository secrets: TESTGEN_DATABASE_URL and TESTGEN_SECRET_KEY (the same as the studio's;
#     a PostgreSQL role for CI is enough), TESTGEN_USERNAME / TESTGEN_PASSWORD (login of the
#     application under test, unless the project keeps one) and, for self-healing and failure
#     analysis, ANTHROPIC_API_KEY (optional: the project's own key is used first; without any a
#     broken locator just fails the step).
#
# Result: a JUnit report (shown by the "Test report" step and kept as an artifact); the run
# history and traces are in the studio. The job fails when a test outside quarantine fails;
# flaky tests (passed on re-run) do not fail it.
name: ui-regression

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"          # nightly full regression

jobs:
  testgen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]            # add firefox, webkit for a cross-browser regression
    env:
      TESTGEN_DATABASE_URL: ${{ secrets.TESTGEN_DATABASE_URL }}
      TESTGEN_SECRET_KEY: ${{ secrets.TESTGEN_SECRET_KEY }}
      TESTGEN_USERNAME: ${{ secrets.TESTGEN_USERNAME }}
      TESTGEN_PASSWORD: ${{ secrets.TESTGEN_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PROJECT: "My project"       # studio project name or id
      TAG: ${{ github.event_name == 'schedule' && '' || 'smoke' }}   # smoke on pushes, everything nightly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: your-org/ai-testgen      # the studio
          path: .testgen
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the studio
        run: |
          python -m pip install -r .testgen/requirements.txt
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run tests
        working-directory: .testgen
        run: |
          python -m testgen.run --project "$PROJECT" ${TAG:+--tag "$TAG"} --browser ${{ matrix.browser }} \
            --junit "$GITHUB_WORKSPACE/reports/junit-${{ matrix.browser }}.xml" --allure "$GITHUB_WORKSPACE/reports/allure"
      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: reports/junit-*.xml
      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testgen-results-${{ matrix.browser }}
          path: reports/
