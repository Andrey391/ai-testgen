[pytest]
testpaths = tests
# pytest-playwright is only needed to run exported tests (in a subprocess).
addopts = -p no:playwright -p no:base_url
# Fast part: -m "not browser"; browser part in parallel: -m browser -n 4 (pytest-xdist).
markers =
    browser: drives a real browser against the stand (slow); set automatically in conftest.py
