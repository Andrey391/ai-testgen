<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Много элементов</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css"></head>
<body>
<main><h1>Каталог</h1><div id="list"></div><div id="picked" role="status"></div></main>
<script>
const list = document.getElementById('list');
for (let i = 1; i <= 400; i++) {
  const b = document.createElement('button');
  b.textContent = 'Товар ' + i;
  b.addEventListener('click', () => document.getElementById('picked').textContent = 'Выбран: Товар ' + i);
  list.appendChild(b);
}
</script>
</body>
</html>
