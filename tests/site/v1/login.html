<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Вход</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css"></head>
<body>
<main>
  <h1>Вход</h1>
  <form id="login-form">
    <label for="username">Логин</label>
    <input id="username" name="username" data-testid="username" autocomplete="off">
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" data-testid="password">
    <div><button type="submit" id="login" data-testid="login-btn">Войти</button></div>
  </form>
  <div id="msg" role="alert"></div>
</main>
<script>
document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const body = {username: document.getElementById('username').value, password: document.getElementById('password').value};
  const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const d = await r.json();
  if (d.ok) location.href = 'list.html';
  else document.getElementById('msg').textContent = 'Неверный логин или пароль';
});
</script>
</body>
</html>
