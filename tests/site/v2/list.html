<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Список покупок</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css"></head>
<body>
<!-- v2: the "add" button changed completely (test id, id, text, position): no recorded
     locator matches it any more, only self-healing can find it. -->
<div class="banner">Новый дизайн</div>
<main>
  <h1>Список покупок</h1>
  <div class="toolbar">
    <input id="item-name" data-testid="item-input" placeholder="Что купить">
    <button id="append" data-testid="append-btn">Добавить пункт</button>
  </div>
  <ul id="items"></ul>
  <div id="count" data-testid="count"></div>
  <label><input type="checkbox" id="done" data-testid="done"> Всё куплено</label>
</main>
<script>
const render = items => {
  document.getElementById('items').innerHTML = items.map(i => `<li data-testid="item">${i.name}</li>`).join('');
  document.getElementById('count').textContent = 'Всего: ' + items.length;
};
fetch('/api/items').then(r => r.json()).then(render);
document.getElementById('append').addEventListener('click', async () => {
  const name = document.getElementById('item-name').value.trim();
  if (!name) return;
  const r = await fetch('/api/items', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name})});
  render(await r.json());
  document.getElementById('item-name').value = '';
});
</script>
</body>
</html>
