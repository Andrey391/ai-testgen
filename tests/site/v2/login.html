<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Вход</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css"></head>
<body>
<!-- v2: new layout. The login button lost its test id and id and moved into a wrapper;
     only its role and text stay, so the exported test must fall back via .or_(). -->
<div class="banner">Новый дизайн</div>
<main>
  <section class="auth">
    <h1>Вход</h1>
    <form id="auth-form">
      <div class="field"><label for="user-login">Логин</label>
        <input id="user-login" name="username" data-testid="username" autocomplete="off"></div>
      <div class="field"><label for="user-password">Пароль</label>
        <input id="user-password" name="password" type="password" data-testid="password"></div>
      <div class="actions"><span><button type="submit" class="primary">Войти</button></span></div>
    </form>
    <div id="msg" role="alert"></div>
  </section>
</main>
<script>
document.getElementById('auth-form').addEventListener('submit', async e => {
  e.preventDefault();
  const body = {username: document.getElementById('user-login').value, password: document.getElementById('user-password').value};
  const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const d = await r.json();
  if (d.ok) location.href = 'list.html';
  else document.getElementById('msg').textContent = 'Неверный логин или пароль';
});
</script>
</body>
</html>
