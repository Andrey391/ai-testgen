# The model benchmark (testgen.bench): real generations, so it costs money - started by hand only.
name: bench

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider id (studio settings); empty = default"
        default: ""
      model:
        description: "Model; empty = the provider's default"
        default: ""
      local_only:
        description: "Only the local stand (no public demo sites)"
        type: boolean
        default: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
      YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
      TESTGEN_DATA_DIR: ${{ github.workspace }}/bench-data
      TESTGEN_SECRETS_DIR: ${{ github.workspace }}/bench-secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Benchmark
        run: |
          python -m testgen.bench ${{ inputs.provider && format('--provider {0}', inputs.provider) || '' }} \
            ${{ inputs.model && format('--model "{0}"', inputs.model) || '' }} ${{ inputs.local_only && '--local-only' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench/results/
